<!-- menu.component.html -->
<div>
  <button (click)="abrirBaseDatos()">Abrir Base de Datos</button>
  <button (click)="obtenerPersonas()">Obtener Personas</button>
</div>

@if (personas.length > 0) {
  <div>
    <h3>Lista de Personas</h3>
    <ul>
      @for (persona of personas; track persona) {
        <li>{{ persona.nombre }}</li>
      }
    </ul>
  </div>
}
